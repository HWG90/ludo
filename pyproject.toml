[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ludo-linux"
version = "0.1.3"
description = "Interactive terminal guide for Windows users moving to Linux — especially gamers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ludo contributors" }]
keywords = ["linux", "gaming", "steam", "proton", "tui", "windows"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=8.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ludo = "ludo.cli:main"

[project.urls]
Homepage = "https://github.com/HWG90/ludo"
Repository = "https://github.com/HWG90/ludo"
Issues = "https://github.com/HWG90/ludo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ludo = ["*.tcss", "content/guides/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
